[package]
name = "dendroid-core"
version = "0.1.0"
description = "Platform-agnostic core logic for dendroid"
edition = "2021"

[lib]
name = "dendroid_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24.0", features = ["v4", "js"] }
loro = "1.13"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2.0"
pulldown-cmark = { version = "0.13.4", default-features = false }

# `crypto` (optional local ledger encryption): ChaCha20-Poly1305 is the AEAD
# each event is encrypted with, `sha2` derives a short fingerprint from a
# key for display, and `rand`'s `OsRng` generates keys/nonces. `getrandom`
# is pulled in directly (not just transitively through `rand`) to turn on
# its "js" feature — same reason `uuid` above enables its own "js" feature:
# without it, the `wasm32-unknown-unknown` build (`dendroid-web`) has no
# OS RNG to call and panics at runtime.
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

# SQLite database support (`sqldb`) is native-only — `bundled` compiles
# SQLite's C source in, so it needs a C toolchain, which the wasm32 target
# this crate also builds for doesn't have. See `sqldb`'s module doc for the
# rest of that scope decision.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
# Blocks on the async `DendroidDocument`/`LedgerStorage` API from plain
# `#[test]` fns without pulling in a full async runtime — `NativeLedgerStorage`
# never actually suspends, so there's nothing for a real executor to do.
pollster = "0.4"
# Only for `tests/sqldb.rs`'s `materialize_to` test, to open the written
# `.sqlite` file back up independently and confirm it's a real, standalone
# database — not just re-exported from the crate itself (integration tests
# only see the public API), so this needs its own copy.
rusqlite = { version = "0.40", features = ["bundled"] }
