[package]
name = "dendroid"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dendroid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dendroid-core = { path = "../src-core" }
dendroid-mcp = { path = "../src-mcp" }
dendroid-acp = { path = "../src-acp" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1.24.0"
base64 = "0.23"
tokio = { version = "1", features = ["sync", "time", "rt", "fs"] }
tokio-util = "0.7"

# The automation engine's cron matcher (`automation::cron_matches`) needs
# local-time field access (`Local::now().hour()`/`.minute()`/...) — same
# crate `dendroid-core` already depends on, kept at the same version.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# OS-keychain-backed storage for the encryption key (see `keychain.rs`) —
# macOS Keychain and Windows Credential Manager come from this crate's own
# native backends; Linux goes through its `zbus`-based Secret Service
# client (pure Rust — no `libdbus-dev`/system D-Bus bindings needed at
# build time, just a running Secret Service provider — GNOME Keyring,
# KWallet's secret-service bridge, etc. — at runtime) rather than the
# `dbus`-crate-based backend, which would need one.
keyring = { version = "4", features = ["apple-native-keyring-store"] }

# Both pulled in solely by `agent_runtime.rs`, to fetch and unpack a
# portable Bun runtime for the "Claude Code"/"Ollama" agent chat presets —
# see that module's doc comment. `rustls-tls` rather than the default
# `default-tls` so this doesn't need a system OpenSSL to build against.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

