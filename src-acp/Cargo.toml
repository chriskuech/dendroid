[package]
name = "dendroid-acp"
version = "0.1.0"
description = "Minimal Agent Client Protocol (ACP) client: spawns an ACP-speaking agent subprocess and speaks newline-delimited JSON-RPC 2.0 over its stdio."
edition = "2021"

[lib]
name = "dendroid_acp"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "sync", "macros", "time"] }
